# Calibrated posterior. tau starts at 0.02 and is fit on the dev split.
experiment: proposed
seed: 0
dev_split_ratio: 0.2
tau: 0.02
alpha: 0.5
rho: 0.90
k_values: [1, 2, 3, 6, 10]
learn_temperature: true

retrieval:
  model_name: openbmb/VisRAG-Ret
  dtype: float16
  attn_implementation: sdpa
  top_k: 10

generation:
  model_name: openbmb/MiniCPM-V-2
  alt_model_name: Qwen/Qwen2-VL-2B-Instruct
  dtype: float16
  attn_implementation: sdpa
  aggregator: learned

novelty:
  marginalization: true
  tiling: true
  adaptive_k: true
  learned_aggregator: true

paths:
  results_dir: results
  cache_dir: results/cache
  checkpoint: checkpoints/best_calibrated_visrag.pt
